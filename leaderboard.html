
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Banana Factory - Leaderboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<!-- floating emojis -->
<div class="floating-emoji" style="top: 10%; left: 12%;">🏆</div>
<div class="floating-emoji slow" style="top: 75%; left: 82%;">🍌</div>
<div class="floating-emoji fast" style="top: 42%; left: 4%;">🥇</div>
<div class="floating-emoji drift-left" style="top: 60%; left: 60%;">⭐</div>
<div class="floating-emoji drift-right" style="top: 20%; left: 88%;">👑</div>
<div class="floating-emoji rotate" style="top: 85%; left: 25%;">🍌</div>
<div class="floating-emoji" style="top: 35%; left: 92%;">✨</div>
<div class="floating-emoji slow" style="top: 15%; left: 5%;">🎯</div>

<div id="messageBox" class="message-box"></div>

<div class="card lb-card">

    <div class="lb-header">
        <h1>🏆 Factory Leaderboard</h1>
        <a class="back-btn" href="home.html">⬅ Back</a>
    </div>

    <div class="leaderboard-container">

        <!-- leaderboard table header -->
        <div class="lb-row lb-title">
            <span>Rank</span>
            <span>Player</span>
            <span>Best Level</span>
            <span>Best Score</span>
        </div>

        <!-- scores appear here -->
        <ul id="leaderboardList" class="lb-list">
            <li class="lb-item empty">📊 No scores yet - Be the first! 🍌</li>
        </ul>

    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
