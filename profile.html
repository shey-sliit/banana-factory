<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile - Banana Factory</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- background -->
<div class="background"></div>

<div id="messageBox" class="message-box"></div>

<!-- profile card -->
<div class="card profile-card">

    <h1>👤 My Profile</h1>

    <div class="profile-info">

        <p><strong>Username:</strong> <span id="profileName"></span></p>

        <p><strong>Email:</strong> <span id="profileEmail"></span></p>

        <p><strong>Birthday:</strong> <span id="birthday"></span></p>

        <hr>

        <p><strong>Games Played:</strong> <span id="gamesPlayed"></span></p>

        <p><strong>Best Score:</strong> <span id="bestScore"></span> 🍌</p>

    </div>

    <!-- buttons -->
    <div class="profile-actions">
        <a href="home.html" class="menu-btn">⬅ Back</a>
        <button onclick="logout()" class="menu-btn logout-btn">🚪 Logout</button>
    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
