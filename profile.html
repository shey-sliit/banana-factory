<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile - Banana Factory</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- background -->
<div class="background"></div>
<div class="floating-emoji" style="top: 10%; left: 12%;">🍌</div>
<div class="floating-emoji slow" style="top: 75%; left: 82%;">👤</div>
<div class="floating-emoji fast" style="top: 42%; left: 4%;">⭐</div>
<div class="floating-emoji drift-left" style="top: 60%; left: 60%;">💎</div>
<div class="floating-emoji drift-right" style="top: 20%; left: 88%;">🍌</div>
<div class="floating-emoji rotate" style="top: 85%; left: 25%;">✨</div>
<div class="floating-emoji" style="top: 35%; left: 92%;">🏅</div>
<div class="floating-emoji slow" style="top: 15%; left: 5%;">🌟</div>

<div id="messageBox" class="message-box"></div>

<!-- profile card -->
<div class="card profile-card">

    <h1>👤 My Profile</h1>

    <div class="profile-info">

        <p><strong>Username:</strong> <span id="profileName"></span></p>

        <p><strong>Email:</strong> <span id="profileEmail"></span></p>


        <hr>

        <p><strong>Games Played:</strong> <span id="gamesPlayed"></span></p>

        <p><strong>Best Score:</strong> <span id="bestScore"></span> 🍌</p>

    </div>

    <!-- buttons -->
    <div class="profile-actions">
        <a href="home.html" class="menu-btn">⬅ Back</a>
        <button onclick="logout()" class="menu-btn logout-btn"> Logout</button>
    </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
