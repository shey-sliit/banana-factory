<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Banana Factory - Home</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background"></div>
  <div class="floating-emoji" style="top: 10%; left: 12%;">🍌</div>
  <div class="floating-emoji slow" style="top: 75%; left: 82%;">🍌</div>
  <div class="floating-emoji fast" style="top: 42%; left: 4%;">🏆</div>
  <div class="floating-emoji drift-left" style="top: 60%; left: 60%;">⭐</div>
  <div class="floating-emoji drift-right" style="top: 20%; left: 88%;">🎉</div>
  <div class="floating-emoji rotate" style="top: 85%; left: 25%;">🍌</div>
  <div class="floating-emoji" style="top: 35%; left: 92%;">💎</div>
  <div class="floating-emoji slow" style="top: 15%; left: 5%;">🌟</div>

<div id="messageBox" class="message-box"></div>

  <div class="card">
    <div class="home-top">
      <div>
        <h1>Welcome, <span id="displayUser"></span> 👷</h1>
        <p class="sub">Choose your shift difficulty.</p>
      </div>
      <button class="danger" onclick="logout()">Logout</button>
    </div>

    <div class="grid">
      <div class="tile" onclick="startGame(1)">
        <h2>Shift 1</h2>
        <p class="sub">5 orders • no timer</p>
      </div>

      <div class="tile" onclick="startGame(2)">
        <h2>Shift 2</h2>
        <p class="sub">10 orders • no timer</p>
      </div>

      <div class="tile" onclick="startGame(3)">
        <h2>Shift 3</h2>
        <p class="sub">15 orders • timer + lives</p>
      </div>

      <div class="tile gold" onclick="goLeaderboard()">
        <h2>🏆 Leaderboard</h2>
        <p class="sub">Top factory workers</p>
      </div>

       <div class="tile" onclick="goProfile()">
        <h2>👤 Profile</h2>
        <p class="sub">Check your profile</p>
      </div>
    </div>

</div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
