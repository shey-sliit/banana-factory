<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Banana Factory - Login</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background"></div>
  <div class="floating-emoji" style="top: 10%; left: 12%;">🍌</div>
  <div class="floating-emoji slow" style="top: 75%; left: 82%;">🍌</div>
  <div class="floating-emoji fast" style="top: 42%; left: 4%;">🍎</div>
  <div class="floating-emoji drift-left" style="top: 60%; left: 60%;">⭐</div>
  <div class="floating-emoji drift-right" style="top: 20%; left: 88%;">❤️</div>
  <div class="floating-emoji rotate" style="top: 85%; left: 25%;">🍌</div>
  <div class="floating-emoji" style="top: 35%; left: 92%;">✨</div>
  <div class="floating-emoji slow" style="top: 15%; left: 5%;">🎯</div>

  <div id="messageBox" class="message-box"></div>
  <div class="card auth-card">

  <h1>🍌 Banana Factory</h1>
  <p class="sub">Clock in and start quality checks.</p>

  <form id="loginForm">
    <input id="username" type="text" placeholder="Username" required />
    <input id="password" type="password" placeholder="Password" required />
    <button type="submit" class="primary">Enter Factory</button>
  </form>

  <div class="links">
    <a href="create.html">Create account</a>
  </div>


  <script type="module" src="script.js"></script>
</body>
</html>
