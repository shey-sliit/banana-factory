<!DOCTYPE html>
<html>
<head>
<title>Settings</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<div class="card">

<h1>⚙ Settings</h1>

<label>
<input type="checkbox" id="soundToggle">
 Sound Effects
</label>

<br><br>

<label>
<input type="checkbox" id="timerToggle">
 Enable Timer
</label>

<br><br>

<button onclick="saveSettings()">Save Settings</button>
<br><br>
<a href="home.html">⬅ Back</a>

</div>

<script>
function saveSettings() {

  const sound = document.getElementById("soundToggle").checked;
  const timer = document.getElementById("timerToggle").checked;

  localStorage.setItem("soundEnabled", sound);
  localStorage.setItem("timerEnabled", timer);

  alert("Settings saved!");
}

/* load saved settings */
window.onload = function () {

  document.getElementById("soundToggle").checked =
    localStorage.getItem("soundEnabled") === "true";

  document.getElementById("timerToggle").checked =
    localStorage.getItem("timerEnabled") !== "false"; // default true
};
</script>

</body>
</html>
